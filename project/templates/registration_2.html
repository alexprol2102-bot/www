<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f0fdf4;
            --surface: #ffffff;
            --border: #d1fae5;
            --accent: #059669;
            --accent-dark: #047857;
            --text: #064e3b;
            --muted: #6b7280;
            --input-bg: #f9fafb;
        }

        body {
            font-family: 'Manrope', system-ui, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .side-panel {
            background: linear-gradient(160deg, #065f46 0%, #047857 50%, #059669 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            position: relative;
            overflow: hidden;
        }

        .side-panel::before {
            content: '';
            position: absolute;
            top: -80px; right: -80px;
            width: 320px; height: 320px;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
        }
        .side-panel::after {
            content: '';
            position: absolute;
            bottom: -60px; left: -60px;
            width: 240px; height: 240px;
            border-radius: 50%;
            background: rgba(255,255,255,0.04);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 56px;
        }

        .brand-icon {
            width: 44px; height: 44px;
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
        }

        .brand-icon svg {
            width: 24px; height: 24px;
            stroke: #fff; fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.03em;
        }

        .side-title {
            font-size: 36px;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
            letter-spacing: -0.03em;
            margin-bottom: 20px;
        }

        .side-desc {
            font-size: 15px;
            color: rgba(255,255,255,0.7);
            line-height: 1.6;
            max-width: 320px;
        }

        .steps {
            margin-top: 48px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .step {
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .step-num {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            display: flex; align-items: center; justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .step-text {
            font-size: 14px;
            color: rgba(255,255,255,0.75);
            padding-top: 4px;
        }

        .form-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: var(--surface);
            overflow-y: auto;
        }

        .form-box {
            width: 100%;
            max-width: 400px;
            padding: 20px 0;
        }

        .form-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }

        .form-subtitle {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 32px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 7px;
        }

        .field input {
            width: 100%;
            padding: 11px 14px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text);
            background: var(--input-bg);
            border: 1.5px solid #e5e7eb;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .field input::placeholder { color: #9ca3af; }

        .field input:focus {
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.12);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            letter-spacing: 0.01em;
        }

        .btn-submit:hover { background: var(--accent-dark); }
        .btn-submit:active { transform: scale(0.99); }

        .divider {
            margin: 24px 0;
            border: none;
            border-top: 1px solid #f3f4f6;
        }

        .switch {
            text-align: center;
            font-size: 14px;
            color: var(--muted);
        }

        .switch a {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
            margin-left: 4px;
        }

        .switch a:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            body { grid-template-columns: 1fr; }
            .side-panel { display: none; }
        }
    </style>
</head>
<body>

<div class="side-panel">
    <div class="brand">
        <div class="brand-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        </div>
        <span class="brand-name">SmartPay</span>
    </div>
    <div class="side-title">Начните<br>прямо<br>сейчас</div>
    <div class="side-desc">Создайте аккаунт за минуту и получите 100 ₽ на баланс в подарок.</div>
    <div class="steps">
        <div class="step">
            <div class="step-num">1</div>
            <div class="step-text">Введите имя, email и придумайте пароль</div>
        </div>
        <div class="step">
            <div class="step-num">2</div>
            <div class="step-text">Получите 100 ₽ приветственного бонуса</div>
        </div>
        <div class="step">
            <div class="step-num">3</div>
            <div class="step-text">Пополняйте баланс и общайтесь с ИИ</div>
        </div>
    </div>
</div>

<div class="form-panel">
    <div class="form-box">
        <div class="form-title">Создать аккаунт</div>
        <div class="form-subtitle">Регистрация займёт меньше минуты</div>

        <form id="register-form">
            <div class="field">
                <label for="fullname">Ваше имя</label>
                <input type="text" id="fullname" name="fullname" placeholder="Иван Иванов" required autocomplete="name">
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="example@mail.ru" required autocomplete="email">
            </div>
            <div class="field">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Придумайте пароль" required autocomplete="new-password">
            </div>
            <div class="field">
                <label for="confirm_password">Повторите пароль</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Повторите пароль" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn-submit">Зарегистрироваться →</button>
        </form>

        <hr class="divider">
        <div class="switch">Уже есть аккаунт? <a href="/login">Войти</a></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.js" integrity="sha512-+k1pnlgt4F1H8L7t3z95o3/KO+o78INEcXTbnoJQ/F2VqDVhWoaiVml/OEHv9HsVgxUaVW+IbiZPUJQfF/YxZw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="{{ url_for('static', filename='script_2.js') }}"></script>
</body>
</html>
